<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>THG CLOUD VPS · Sign in</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
<main class="login-card">
  <div class="brand big">THG <span>CLOUD VPS</span></div>
  <p class="muted">Private workspace. Sign in to continue.</p>
  <form id="login-form" autocomplete="on">
    <label>Username<input id="u" name="username" autocomplete="username" required autofocus></label>
    <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="err" class="error" role="alert"></p>
  </form>
</main>
<script src="/js/login.js"></script>
</body>
</html>
